; cnc-ddraw v7.1.0.0 configuration for Beasts & Bumpkins under CrossOver.
; Unlisted keys use cnc-ddraw defaults. Full option reference ships in the
; release's own ddraw.ini (.local/downloads/cnc-ddraw-v7.1.0.0/extracted/).
[ddraw]
; Initial window size. bb.py install rewrites width/height: 2x for 640x480,
; 1x for larger --resolution installs. The game's image is scaled into the
; window, so changing the resolution in game doesn't resize it.
width=1280
height=960
; windowed=true always. fullscreen=true then means borderless fullscreen,
; which avoids a real display mode switch (that breaks on macOS).
; bb.py run rewrites the fullscreen= line for --window/--fullscreen.
windowed=true
fullscreen=false
; Alt+Enter toggles between window and borderless fullscreen.
toggle_borderless=true
maintas=true
boxing=false
resizable=true
border=true
posX=-32000
posY=-32000

; Crisp pixels at integer scale.
shader=Nearest neighbor
renderer=opengl

; cnc-ddraw owns the cursor: confines it to the window and scales movement,
; which replaces the game's own SetCursorPos warping.
adjmouse=true
devmode=false

; Remember the window size and position on exit. bb.py run keeps them;
; bb.py install resets them.
savesettings=1

; Presentation rate only, game speed is unaffected.
maxfps=-1
maxgameticks=0
